<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#2a1606" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tanks!</title>
    <meta name="description" content="Toy tank battles in the browser: the classic campaign, online co-op and versus, and a big multiplayer arena." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/MPLUS1-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="ui"></canvas>
      <!-- classic UI only: the way back to the web menus (App.setupClassicExit) -->
      <button id="classic-exit" type="button" hidden>Modern UI</button>
      <button id="pause-btn" type="button" aria-label="Pause" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" /><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" /></svg>
      </button>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
