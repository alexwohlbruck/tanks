server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;


  gzip on;
  gzip_types application/javascript application/json text/css model/gltf-binary;

  # hashed bundles never change
  location ~ ^/assets/index-.*\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # game data converted from the disc: cache, but revalidate
  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
    # formats nginx's default mime.types lacks
    location ~ \.flac$ {
      default_type audio/flac;
      add_header Cache-Control "public, max-age=3600";
    }
    location ~ \.glb$ {
      default_type model/gltf-binary;
      add_header Cache-Control "public, max-age=3600";
    }
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
